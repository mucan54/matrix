server_name: {{SYNAPSE_SERVER_NAME}}

macaroon_secret_key: "{{GENERATE_A_RANDOM_STRING_HERE}}"

listeners:
  - port: 8008
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]

report_stats: False

logging:
  - module: synapse.storage.SQL
    level: INFO

use_x_forwarded: true
bind_addresses: ['127.0.0.1']

trusted_key_servers:
  - server_name: "matrix.org"
suppress_key_server_warning: true

enable_registration: false
password_config:
  enabled: false

admin_contact: 'mailto:{{ADMIN_EMAIL}}'

# Disable E2EE by default
encryption_enabled_by_default_for_room_type: false

# Block encrypted room creation with proper action
room_list_publication_rules:
  - matches: '.*'
    action: deny
    exclude_encrypted_rooms: true

experimental_features:
  msc3967_enabled: true
  msc3967_allow_self_reset: true
  msc3861:
    enabled: true
    issuer: http://synapse-mass-authentication-service:8080
    client_id: 0000000000000000000SYNAPSE
    client_auth_method: client_secret_basic
    client_secret: "{{SYNAPSE_MAS_SECRET}}"
    admin_token: "{{SYNAPSE_API_ADMIN_TOKEN}}"
    account_management_url: "{{KEYCLOAK_FQDN}}/realms/{{KEYCLOAK_REALM_IDENTIFIER}}/account"